<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rawi's Drive - CCSP</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --border: #333;
    --text: #e0e0e0;
    --muted: #9a9a9a;
    --accent: #4f8cff;
    --accent-hover: #6ea0ff;
    --success: #3ecf8e;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 30px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 16px 0;
    color: var(--accent);
  }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    margin-bottom: 14px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #555; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 0.85rem;
    padding: 10px 12px;
    border-radius: 6px;
    display: none;
  }
  .status.success { background: rgba(62,207,142,0.1); color: var(--success); display: block; }
  .status.error { background: rgba(255,107,107,0.1); color: var(--error); display: block; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 0.85rem;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; }
  pre {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-size: 0.8rem;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>

<h1>Rawi's Drive</h1>
<div class="subtitle">CCSP-CloudStorage — local file client</div>

<div class="card">
  <h2>Upload File</h2>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload</button>
  <div class="status" id="uploadStatus"></div>
</div>

<div class="card">
  <h2>File Info</h2>
  <button id="fetchInfoBtn">Get File Info</button>
  <div class="status" id="infoStatus"></div>
  <div id="infoResult"></div>
</div>

<script>
const UPLOAD_URL = "/file/upload";
const INFO_URL = "/file/getfileInfo";

const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");

const fetchInfoBtn = document.getElementById("fetchInfoBtn");
const infoStatus = document.getElementById("infoStatus");
const infoResult = document.getElementById("infoResult");

function setStatus(el, message, type) {
  el.textContent = message;
  el.className = "status " + type;
}

uploadBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    setStatus(uploadStatus, "Pick a file first.", "error");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  uploadBtn.disabled = true;
  setStatus(uploadStatus, "Uploading...", "success");

  try {
    const res = await fetch(UPLOAD_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || ("HTTP " + res.status));
    }

    setStatus(uploadStatus, "Uploaded successfully: " + file.name, "success");
  } catch (err) {
    setStatus(uploadStatus, "Upload failed: " + err.message, "error");
  } finally {
    uploadBtn.disabled = false;
  }
});

fetchInfoBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    setStatus(infoStatus, "Pick a file first.", "error");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  fetchInfoBtn.disabled = true;
  setStatus(infoStatus, "Fetching...", "success");
  infoResult.innerHTML = "";

  try {
    const res = await fetch(INFO_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || ("HTTP " + res.status));
    }

    const data = await res.json();
    setStatus(infoStatus, "Loaded.", "success");
    renderInfo(data);
  } catch (err) {
    setStatus(infoStatus, "Fetch failed: " + err.message, "error");
  } finally {
    fetchInfoBtn.disabled = false;
  }
});

function renderInfo(data) {
  const items = Array.isArray(data) ? data : [data];

  if (items.length === 0) {
    infoResult.innerHTML = "<p style='color:var(--muted)'>No file info returned.</p>";
    return;
  }

  // Collect all unique keys across items to build table headers dynamically
  const keys = [...new Set(items.flatMap(obj => Object.keys(obj)))];

  let html = "<table><thead><tr>";
  keys.forEach(k => html += `<th>${k}</th>`);
  html += "</tr></thead><tbody>";

  items.forEach(obj => {
    html += "<tr>";
    keys.forEach(k => {
      html += `<td>${obj[k] !== undefined ? obj[k] : ""}</td>`;
    });
    html += "</tr>";
  });

  html += "</tbody></table>";
  infoResult.innerHTML = html;
}
</script>

</body>
</html>
